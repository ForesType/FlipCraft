<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!--
    PhotoCraft Windows Application Logo
    ====================================
    - Platform: Windows 11 Fluent App Icon Specification
    - Concept: "The Prismatic Atelier" (Unified Living Gradient)
    - Geometry: Standard 512x512 canvas, 440x440 squircle (rx=104)
    - Beak: Clear top transition corner, downward aerodynamic angle, smooth bottom integration
  -->
  <defs>
    <!-- Background Canvas: Studio Obsidian Plate -->
    <linearGradient id="bg-plate-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a2c"/>
      <stop offset="45%" stop-color="#10121e"/>
      <stop offset="100%" stop-color="#080912"/>
    </linearGradient>

    <!-- Specular Border Rim for Windows 11 Fluent Acrylic / Mica -->
    <linearGradient id="plate-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Studio Backlight / Radial Creative Glow -->
    <radialGradient id="studio-glow" cx="66%" cy="30%" r="58%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.16"/>
      <stop offset="30%" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.10"/>
      <stop offset="90%" stop-color="#ec4899" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Unified Living Artist Multi-Stop Gradient across entire bird & beak -->
    <linearGradient id="bird-unified-grad" x1="84%" y1="18%" x2="28%" y2="88%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="12%" stop-color="#38bdf8"/>
      <stop offset="28%" stop-color="#3b82f6"/>
      <stop offset="46%" stop-color="#6366f1"/>
      <stop offset="64%" stop-color="#a855f7"/>
      <stop offset="80%" stop-color="#ec4899"/>
      <stop offset="92%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>

    <!-- Crown & Leading Edge Light Sheen -->
    <linearGradient id="crown-sheen" x1="85%" y1="15%" x2="35%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Windows Fluent Elevation Shadow -->
    <filter id="win-plate-shadow" x="-15%" y="-10%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.30"/>
    </filter>

    <!-- Soft Bird Ambient Bloom -->
    <filter id="bird-soft-glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComponentTransfer in="blur" result="glowAlpha">
        <feFuncA type="linear" slope="0.40"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glowAlpha"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Windows 11 App Tile Canvas -->
  <g id="app-canvas" filter="url(#win-plate-shadow)">
    <!-- Base Plate -->
    <rect x="36" y="36" width="440" height="440" rx="104" fill="url(#bg-plate-grad)"/>

    <!-- Specular Border Rim -->
    <rect x="36.5" y="36.5" width="439" height="439" rx="103.5" fill="none" stroke="url(#plate-border-grad)" stroke-width="1.5"/>

    <!-- Studio Backlight Glow -->
    <rect x="37" y="37" width="438" height="438" rx="103" fill="url(#studio-glow)"/>
  </g>

  <!-- 2. The Living Artist Bird Graphic: ONE continuous path sharing the same living gradient -->
  <g id="artist-bird" filter="url(#bird-soft-glow)">
    <path id="bird-unified" d="M 173.7,163.75 C 199.05,155.37 224.4,146.79 249.75,139.05 C 211.2,179.68 165.44,230.63 133.4,274.25 C 188.0,231.22 242.6,196.44 297.2,150.1 C 265.09,240.64 253.52,331.25 231.55,421.8 C 261.97,345.3 298.24,265.99 326.45,188.45 C 333.47,165.05 342.7,141.65 348.55,118.25 C 354.0,113.0 364.0,108.0 375.0,104.0 L 385.0,103.0 L 372.5,91.2 C 367.0,56.5 325.93,66.97 303.05,81.2 C 260.6,98.94 212.89,137.56 173.7,163.75 Z" fill="url(#bird-unified-grad)"/>
    <path id="bird-sheen" d="M 173.7,163.75 C 199.05,155.37 224.4,146.79 249.75,139.05 C 211.2,179.68 165.44,230.63 133.4,274.25 C 188.0,231.22 242.6,196.44 297.2,150.1 C 265.09,240.64 253.52,331.25 231.55,421.8 C 261.97,345.3 298.24,265.99 326.45,188.45 C 333.47,165.05 342.7,141.65 348.55,118.25 C 354.0,113.0 364.0,108.0 375.0,104.0 L 385.0,103.0 L 372.5,91.2 C 367.0,56.5 325.93,66.97 303.05,81.2 C 260.6,98.94 212.89,137.56 173.7,163.75 Z" fill="url(#crown-sheen)"/>
  </g>
</svg>