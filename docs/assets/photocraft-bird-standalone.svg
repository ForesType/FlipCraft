<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- PhotoCraft Living Bird - Standalone Transparent Vector -->
  <defs>
    <linearGradient id="bird-unified-grad" x1="84%" y1="18%" x2="28%" y2="88%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="12%" stop-color="#38bdf8"/>
      <stop offset="28%" stop-color="#3b82f6"/>
      <stop offset="46%" stop-color="#6366f1"/>
